[package]
name = "stream-ciphers-mayhem-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# 0.4, not the live layer's 0.5: at this historical commit hc-256/rabbit/salsa20
# still depend on cipher 0.4.4, and a 0.5 import doesn't satisfy their trait impls.
cipher = "0.4.4"

[dependencies.rabbit]
path = "../../rabbit"

[dependencies.hc-256]
path = "../../hc-256"

[dependencies.salsa20]
path = "../../salsa20"

# Prevent this from interfering with the upstream workspace.
[workspace]
members = ["."]

[[bin]]
name = "rabbit"
path = "fuzz_targets/rabbit.rs"
test = false
doc = false

[[bin]]
name = "hc-256"
path = "fuzz_targets/hc-256.rs"
test = false
doc = false

[[bin]]
name = "salsa20"
path = "fuzz_targets/salsa20.rs"
test = false
doc = false
